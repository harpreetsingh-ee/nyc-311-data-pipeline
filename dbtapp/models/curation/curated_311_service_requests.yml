version: 2
models:
  - name: curated_311_service_requests
    description: "Curated 311 service requests data - incremental model with is_incremental() toggle"

    columns:
      - name: unique_key
        description: "Unique key for each service request"
        tests:
          - unique
          - not_null
      - name: created_year
        description: "Year when the service request was created"
      - name: created_month
        description: "Month when the service request was created"
      - name: is_closed
        description: "Flag indicating if the service request is closed"
      - name: resolution_hours
        description: "Number of hours taken to resolve the service request"
      - name: agency
        description: "Agency responsible for the service request"
      - name: agency_name
        description: "Name of the agency responsible for the service request"
      - name: borough
        description: "Borough where the service request originated"
        tests:
          - accepted_values:
              arguments:
                values: ["Bronx", "Brooklyn", "Manhattan", "Queens", "Staten Island", "Unspecified"]
      - name: complaint_type
        description: "Type of complaint"
      - name: descriptor
        description: "Descriptor for the service request"
      - name: status
        description: "Current status of the service request"
      - name: created_date
        description: "Date when the service request was created"
        tests:
          - not_null
      - name: closed_date
        description: "Date when the service request was closed"
      - name: resolution_action_updated_date
        description: "Date when the resolution action was last updated"
      - name: open_data_channel_type
        description: "Type of open data channel used"
      - name: loaded_at
        description: "Timestamp when the data was loaded"
        tests:
          - not_null
