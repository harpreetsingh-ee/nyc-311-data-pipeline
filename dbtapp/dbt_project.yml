name: dbtapp

profile: dbt

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

# seeds:
#   # Builds seeds into '<your_schema_name>_raw'
#   dbtapp:
#     +schema: HARPREET_SINGH


models:
  dbtapp:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
      +schema: CURATED

    curation:
      +materialized: table
      +schema: CURATED
    
    consume:
      +materialized: table
      +schema: CONSUME
    
    tests:
      +materialized: table
      +schema: TESTS

vars:
  resolution_hours_threshold: 72