version: '3.1'
services:
  scheduler:
    image: astrocrpublic.azurecr.io/runtime:3.3-7
    volumes:
      - ${PROJECT_ROOT:-..}/dbtapp:/usr/local/airflow/dbtapp
      - ~/.dbt:/home/astro/.dbt
      - ${PROJECT_ROOT:-..}/.dbtenv:/usr/local/airflow/dbt-env
      - ${PROJECT_ROOT:-..}/keys:/usr/local/airflow/keys:usr/local/airflow/keys
  webserver:
    image: astrocrpublic.azurecr.io/runtime:3.3-7
    volumes:
      - ${PROJECT_ROOT:-..}/dbtapp:/usr/local/airflow/dbtapp
      - ~/.dbt:/home/astro/.dbt
      - ${PROJECT_ROOT:-..}/.dbtenv:/usr/local/airflow/dbt-env
      - ${PROJECT_ROOT:-..}/keys:/usr/local/airflow/keys:usr/local/airflow/keys
  triggerer:
    image: astrocrpublic.azurecr.io/runtime:3.3-7
    volumes:
      - ${PROJECT_ROOT:-..}/dbtapp:/usr/local/airflow/dbtapp
      - ~/.dbt:/home/astro/.dbt
      - ${PROJECT_ROOT:-..}/.dbtenv:/usr/local/airflow/dbt-env
      - ${PROJECT_ROOT:-..}/keys:/usr/local/airflow/keys:usr/local/airflow/keys
